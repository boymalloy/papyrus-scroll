{% extends "base.html" %}

{% block content %}
<div class="container">

    {% block page_content %}

    <h1>Welcome to Papyrus Scroll</h1>
    <h2>Your documents</h2>
        {% for item in source_files %}
           <p><a href="/edit?file={{item[0]}}">{{item[1]}}</a></p> 
        {% endfor %}

    <h2>More options</h2>

    <p><a href="/new">Create a new document</a></p>

    <p><a href="/export">Export all documents</a></p>


{% endblock %}

</div>
{% endblock %}
